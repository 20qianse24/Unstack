<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Unstack">
    <title>Unstack</title>
    <link type="text/css" rel="stylesheet" href="/static/css/styles.css">
    <script src="app.js" defer></script>
    <link rel="manifest" href="manifest.json" />
    <!--App icon credit to https://www.flaticon.com/free-icon/sticky-note_9099135, allowing free personal and commercial use with credit-->
    <link rel="icon" href="./static/icons/ios/180.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" type="image/png">
     <!--
    <link rel="apple-touch-icon" sizes="192x192" href="./static/icons/ios/192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="./static/icons/ios/512.png">-->

</head>

<body>
    <h1>UNSTACK</h1>
    <header>
      <!--Nagivation tabs-->
      <div class="tab-buttons">
        <button data-tab="tab-all" class="active">All</button>
        <button data-tab="tab-priorities">Priorities</button>
        <button data-tab="tab-groups">Groups</button>
      </div>
      <!--Search button-->
      <button class="icon-btn" id="toggle-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </button>
    </header>
    <!--Search input box, hidden until toggled open-->
    <div id="search" style='display: none'>
      <input type="search" id="search-input" placeholder="Search tasks">
    </div>

    <!--Task viewing tabs-->
    <main>
      <!--All tasks-->
      <section class="task-tab" id="tab-all">
        <h2 id="tasks-heading">All</h2>
        <ul id="all-task-list"></ul>
      </section>

      <!--Group labels of tasks, click to see tasks in a group-->
      <section class="task-tab" id="tab-groups">
        <h2 id="tasks-heading">Groups</h2>
        <!--Display group labels, click to see tasks in that group-->
        <div id="group-list"></div>
      </section>

      <!--Display by priority level-->
      <section class="task-tab" id="tab-priorities">
        <h2 id="tasks-heading">Priorities</h2>
        <div class="priority-section" id="high-priority">
          <h4 class="priority-group-label">High: </h4>
          <ul id="high-priorities-task-list"></ul>
        </div>
        <div class="priority-section" id="mid-priority">
          <h4 class="priority-group-label">Medium: </h4>
          <ul id="mid-priorities-task-list"></ul>
        </div>
        <div class="priority-section" id="low-priority">
          <h4 class="priority-group-label">Low: </h4>
          <ul id="low-priorities-task-list"></ul>
        </div>
      </section>
    </main>

    <footer>
      <button id="new-task">+</button>
    </footer>

    <!--Add task form-->
    <dialog id="add-task-dialog">
      <button id="close-add-task">X</button>
      <h4 id="add/edit-form-title">Add Task</h4>
      <form id="add-task">
        <!--Get task title-->
          <div class ="form-group">
            <div class ="form-label"><label for="title">Task <span>*</span>:</label></div>
            <div class ="form-element"><input type="text" name="title" id="title" placeholder="Enter task..." required></div>
          </div>
        <!--Get description/extra notes-->
          <div class ="form-group">
            <div class ="form-label"><label for="description">Extra Notes:</label></div>
            <div class ="form-element">
              <!--teaxtarea allows multiple lines of text, rows="3" means 3 rows of visibility when typing NOT a limit-->
              <!--Note that unlike input, textarea is NOT a self closing tag-->
              <textarea name="description" id="description" placeholder="Enter extra notes..." rows="3"></textarea>
            </div>
          </div>
        <!--Get priority label-->
          <div class ="form-group">
            <div class ="form-label"><label for="priority">Priority <span>*</span>:</label></div>
            <div class ="form-element">
              <select id="priority" name="priority" required>
                    <option value="" selected disabled>Select a priority level</option>
                    <option value="low">Low</option>
                    <option value="mid">Medium</option>
                    <option value="high">High</option>
              </select>
            </div>
          </div>
        <!--Get group label-->
        <div class ="form-group">
          <div class ="form-label"><label for="group">Task Group:</label></div>
          <div class ="form-element">
            <select id="group" name="group">
              <option value="">No group</option>
              <option value="__add_new_group__">Add new group...</option>
            </select>
            <input type="text" id="new-group" placeholder="New group name" hidden disabled>
          </div>
        </div>
          <!--Submit button-->
          <button id="submit-btn" type="submit">Add Task</button>
      </form>
    </dialog>

    <!--Pop up edit and delete window when a task is clicked-->
    <dialog id="task-options">
      <button id="close-window">X</button>
      <h4 id="clicked-task-title"></h4>
      <p id="clicked-task-description"></p>
      <p id="clicked-task-group"></p>
      <button id="edit-btn">Edit</button>
      <button id="delete-btn">Delete</button>
    </dialog>

</body>
